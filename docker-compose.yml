version: "3.8"

services:
  mysql:
    image: mysql:8
    container_name: mysql_tienda
    restart: always
    environment:
      MYSQL_DATABASE: bd_fullstack
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"

  backend:
    build: .
    ports:
      - "8500:8500"
    depends_on:
      - mysql
    environment:
      DB_URL: jdbc:mysql://mysql:3306/bd_fullstack
      DB_USER: root
      DB_PASSWORD: root
